name: 🤖 Hourly Intelligence Collection

on:
  schedule:
    # Scheduled intelligence collection: every 10 minutes
    # Provides near-real-time threat intelligence updates
    - cron: '*/10 * * * *'

  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Run full intelligence collection'
        type: boolean
        default: true

jobs:
  intel-collector:
    runs-on: ubuntu-latest
    name: 🌐 Threat Intelligence Collector

    steps:
      - name: Checkout get-data repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4

      - name: 🇨🇳 [1/3] Chinese Tech Community
        run: |
          echo "采集掘金 / 知乎 / CSDN / 51Testing..."
          python .github/scripts/chinese_community.py 2>&1 | tail -10

      - name: 🌍 [2/3] Global Threat Intelligence Network
        run: |
          echo "采集 NVD / OSV / Exploit-DB..."
          python .github/scripts/intelligence_network.py 2>&1 | tail -8

      - name: 📊 [3/3] Generate Summary
        run: |
          python .github/scripts/summary.py 2>&1

      - name: 📦 Auto Commit & Push
        run: |
          git config user.name "Pointend Data Bot"
          git config user.email "data-bot@pointend.io"

          git add attack_vectors.db UPDATE_LOG.txt

          if ! git diff --cached --quiet; then
            git commit -m "data: 🤖 威胁情报自动更新 $(date '+%Y-%m-%d %H:%M')

            📊 自动采集: 国内社区 + 全球 CVE 情报
            🕒 每 10 分钟自动进化一次"
            git push
            echo ""
            echo "✅ 情报更新成功"
          else
            echo "⏸️  无新数据"
          fi

      - name: 📤 Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: attack-vectors-db
          path: attack_vectors.db
          retention-days: 7
